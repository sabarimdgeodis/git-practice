<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trailer Condition Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Trailer Condition</h1>
    <form>
      <label for="trailer-no">Trailer no</label>
      <input id="trailer-no" name="trailerNo" type="text" required>

      <label for="carrier">Carrier</label>
      <input id="carrier" name="carrier" type="text" required>

      <label for="pickup-location">Pickup location</label>
      <input id="pickup-location" name="pickupLocation" type="text" required>

      <fieldset>
        <legend>Do you see any existing damage?</legend>
        <div class="radio-options">
          <label><input name="existingDamage" type="radio" value="yes" required> Yes</label>
          <label><input name="existingDamage" type="radio" value="no"> No</label>
        </div>
      </fieldset>

      <label for="damaged">What is damaged</label>
      <input id="damaged" name="damaged" type="text">

      <label for="description">Description</label>
      <input id="description" name="description" type="text">

      <label for="front-photo">Front Photo</label>
      <input id="front-photo" name="frontPhoto" type="file" accept="image/*" capture="environment">

      <label for="driver-side-photo">Driver Side Photo</label>
      <input id="driver-side-photo" name="driverSidePhoto" type="file" accept="image/*" capture="environment">

      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
